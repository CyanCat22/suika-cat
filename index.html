<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffeede">
<meta name="description" content="合成大猫咪：竖屏手机小游戏。拖动投猫，两只一样的猫碰到一起就合成下一级，10 级进化到猫神，一局只要 1 分钟。">
<meta property="og:title" content="合成大猫咪 · 一局 1 分钟的猫咪合成小游戏">
<meta property="og:description" content="两只一样的猫合成下一级，10 级进化到猫神。纯代码手绘猫咪 + 实时合成音效，打开就玩。">
<meta property="og:type" content="website">
<meta name="format-detection" content="telephone=no">
<title>合成大猫咪 · 一局 1 分钟</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M12 22 L18 6 L28 16 Z' fill='%23ffcb80' stroke='%238a5a2e' stroke-width='3'/%3E%3Cpath d='M52 22 L46 6 L36 16 Z' fill='%23ffcb80' stroke='%238a5a2e' stroke-width='3'/%3E%3Ccircle cx='32' cy='36' r='24' fill='%23ffcb80' stroke='%238a5a2e' stroke-width='3'/%3E%3Ccircle cx='24' cy='34' r='3.4' fill='%233b2c2e'/%3E%3Ccircle cx='40' cy='34' r='3.4' fill='%233b2c2e'/%3E%3Cpath d='M27 44 q5 5 10 0' stroke='%233b2c2e' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="game" width="720" height="1280" aria-label="合成大猫咪游戏区"></canvas>

  <div id="ui">
    <div class="corner-btns">
      <button id="btn-mute" class="icon-btn" aria-label="静音">🔊</button>
      <button id="btn-pause" class="icon-btn" aria-label="暂停">❚❚</button>
    </div>

    <div id="hint" class="hint">拖动猫咪选位置 · 松手投放 🐾</div>

    <!-- 首页 -->
    <section id="menu" class="screen show">
      <div class="logo-wrap">
        <div class="logo-sub">SYNTHETIC CATS</div>
        <h1 class="logo">合成<span>大猫咪</span></h1>
        <p class="tagline">两只一样的猫 → 合成下一级</p>
      </div>
      <canvas id="menu-chain" width="720" height="150"></canvas>
      <ul class="howto">
        <li><b>拖动</b>决定落点，<b>松手</b>把猫丢进罐子</li>
        <li>两只同款猫碰到一起，就会进化成下一只</li>
        <li>猫堆别超过虚线，撑住 <b>1.7 秒</b> 就结束</li>
      </ul>
      <button id="btn-start" class="btn-main">开 始 撸 猫</button>
      <p class="footnote">纯前端 · 零依赖 · 一局 1 分钟</p>
    </section>

    <!-- 结束 -->
    <section id="over" class="screen">
      <div class="over-head">
        <span class="over-label">本 局 分 数</span>
        <div id="over-record" class="record">新 纪 录</div>
      </div>
      <div id="over-score" class="over-score">0</div>
      <div class="over-best">最高分 <b id="over-best">0</b></div>
      <div class="stat-grid">
        <div><span>进化到</span><b id="over-cat">奶团子</b></div>
        <div><span>合成次数</span><b id="over-merge">0</b></div>
        <div><span>最高连击</span><b id="over-combo">x0</b></div>
      </div>
      <button id="btn-again" class="btn-main">再 来 一 局</button>
      <div class="row-btns">
        <button id="btn-share" class="btn-ghost">生成战绩卡</button>
        <button id="btn-home" class="btn-ghost">回首页</button>
      </div>
      <p class="footnote">点「生成战绩卡」→ 保存图片，直接发小红书</p>
    </section>

    <!-- 暂停 -->
    <section id="pause" class="screen">
      <h2 class="pause-title">歇一会儿</h2>
      <button id="btn-resume" class="btn-main">继 续 撸 猫</button>
      <button id="btn-restart" class="btn-ghost">重新开始</button>
    </section>

    <!-- 分享图 -->
    <section id="share" class="screen">
      <h2 class="pause-title">战 绩 卡</h2>
      <img id="share-img" alt="战绩卡预览">
      <button id="btn-save" class="btn-main">保存图片</button>
      <p id="save-tip" class="save-tip">已保存 · 手机端可长按图片存相册</p>
      <button id="btn-close-share" class="btn-ghost">关闭</button>
    </section>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/physics.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/sharecard.js"></script>
<script src="js/main.js"></script>
</body>
</html>
